[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jvm-log-analyzer"
version = "0.1.0"
description = "Multi-agent JVM diagnostics for GC logs, thread dumps, and heap dumps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JVM Diagnostic Agents contributors" }]
keywords = ["jvm", "gc", "thread-dump", "heap-dump", "langchain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Logging",
]
dependencies = [
  "langchain>=0.3.0,<0.4",
  "langchain-openai>=0.2.0,<0.4",
  "langchain-core>=0.3.0,<0.4",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jvm-diag = "jvm_diag.cli:main"

[tool.setuptools.packages.find]
include = ["jvm_diag*"]

[tool.setuptools.package-data]
jvm_diag = ["prompts/*.md", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
